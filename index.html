  h += row("EAD identifier", esc(m.eadid));
  h += row("Encoding", esc(m.flavour));
  h += "</table>";

  h += band("ACCESS AND USE") + '<table class="fields">';
  for (const k of ["accessrestrict","userestrict","prefercite"]) h += noteBlock(k, opts);
  h += "</table>";

  h += "<h2>Collection Contents</h2>";
  if (!m.tree.length) h += "<p>No components.</p>";
  else h += (opts.mode === "table") ? renderComponentTable(m.tree, opts)
                                    : m.tree.map(c=>renderComponentOAC(c,opts)).join("");

  document.getElementById("doc").innerHTML = h;
  document.getElementById("stage").hidden = false;
  document.getElementById("drop").hidden = true;
  document.getElementById("copy").disabled = false;
  buildMargin();
  renderChips();
}

/* ---------- the margin layer ---------- */
const NOTE_GAP = 8;
const MAX_DRIFT = 110;   /* beyond this a note is visibly marked as displaced */

function buildMargin(){
  const margin = document.getElementById("margin");
  margin.innerHTML = "";

  /* The two contents views expose different elements — the table view has no
     row for a component's container or dates — so an anchor may have nothing
     to point at. Fall back to the component's title, and if even that is
     absent, move the finding to the collection list. A finding must never
     disappear because of a display setting. */
  const resolved = new Map();
  const orphans = [];
  for (const [key, flags] of ANCHORS){
    let id = domId(key);
    if (!document.getElementById(id)){
      const mm = /^n:(\d+):/.exec(key);
      const fallback = mm ? domId("n:"+mm[1]+":title") : null;
      if (fallback && document.getElementById(fallback)) id = fallback;
      else { orphans.push(...flags); continue; }
    }
    if (!resolved.has(id)) resolved.set(id, []);
    resolved.get(id).push(...flags);
  }

  /* Collection-wide findings sit outside the positioned layer, collapsed to
     one line so they cost almost no vertical space at the top. */
  const gbox = document.createElement("div");
  gbox.id = "mglobal";
  const globals = GLOBAL.concat(orphans);
  if (globals.length){
    const head = document.createElement("button");
    head.id = "mglobal-head";
    head.setAttribute("aria-expanded","false");
    head.textContent = globals.length + " about the collection as a whole";
    const body = document.createElement("div");
    body.id = "mglobal-body";
    for (const f of globals){
      const d = document.createElement("div");
      d.className = "mnote static " + f.sev;
      d.dataset.sev = f.sev; d.dataset.aud = f.audience;
      d.innerHTML = '<div class="txt">'+esc(f.text)+'</div><div class="meta">'+esc(f.rule)+"</div>";
      body.appendChild(d);
    }
    head.onclick = () => {
      const open = gbox.classList.toggle("open");
      head.setAttribute("aria-expanded", String(open));
      schedulePosition();
    };
    gbox.appendChild(head); gbox.appendChild(body);
  }
  margin.appendChild(gbox);

  /* One note per target. Several findings on the same element used to stack
     as separate notes and start a cascade; they're lines within one note. */
  for (const [id, flags] of resolved){
    const worst = ["error","warn","gap","info"].find(s => flags.some(f=>f.sev===s)) || "info";
    const d = document.createElement("div");
    d.className = "mnote " + worst;
    d.dataset.target = id;
    d.innerHTML = flags.map(f =>
      '<div class="finding" data-sev="'+f.sev+'" data-aud="'+f.audience+'">' +
      '<div class="txt">'+esc(f.text)+"</div>" +
      '<div class="meta">'+esc(f.rule)+
      (f.sev==="gap" ? "" : ' · <span class="aud">'+(f.audience==="author"?"mechanical":"judgement")+"</span>") +
      "</div></div>").join("");
    d.addEventListener("mouseenter", ()=>{ const t=document.getElementById(d.dataset.target); if (t) t.classList.add("lit"); });
    d.addEventListener("mouseleave", ()=>{ const t=document.getElementById(d.dataset.target); if (t) t.classList.remove("lit"); });
    d.addEventListener("click", ()=>{
      const t=document.getElementById(d.dataset.target);
      if (t) t.scrollIntoView({block:"center", behavior:"smooth"});
    });
    margin.appendChild(d);
  }
  schedulePosition();
}

/* Measure only once the webfont has settled — EB Garamond arrives
   asynchronously and every height changes when it does. */
let positionPending = false;
function schedulePosition(){
  if (positionPending) return;
  positionPending = true;
  requestAnimationFrame(()=>{ positionPending = false; positionMargin(); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedulePosition);

/* Each note wants to sit level with the middle of what it refers to. Where
   several want the same space they form a cluster, and the cluster is placed
   around the average of its members' wishes — so crowding pushes notes both
   up and down instead of queueing them all downwards from the first one. */
function positionMargin(){
  const stage = document.getElementById("stage");
  const margin = document.getElementById("margin");
  if (!margin || stage.classList.contains("narrow")) return;

  const gbox = document.getElementById("mglobal");
  const floor = (gbox ? gbox.offsetHeight : 0) + 14;
  const base = margin.getBoundingClientRect().top;

  const items = [];
  for (const n of margin.children){
    if (n.id === "mglobal" || n.hidden) continue;
    const t = document.getElementById(n.dataset.target);
    if (!t) continue;
    const r = t.getBoundingClientRect();
    const h = n.offsetHeight;
    const ideal = (r.top - base) + (Math.min(r.height, 120) / 2) - h/2;
    items.push({el:n, h, ideal, want:ideal, top:Math.max(floor, ideal)});
  }
  if (!items.length){ margin.style.height = floor+"px"; return; }

  items.sort((a,b)=>a.want-b.want);

  let guard = 0, changed = true;
  while (changed && guard++ < 60){
    changed = false;
    /* A cluster can shift upwards past a note that preceded it, so the order
       notes want to be in stops matching the order they are in. Re-sort each
       pass or the overlap scan compares the wrong pairs. */
    items.sort((a,b)=>a.top-b.top);
    for (let i=0; i<items.length-1; i++){
      if (items[i+1].top >= items[i].top + items[i].h + NOTE_GAP) continue;
      /* grow the cluster over everything that now overlaps */
      let s = i, e = i+1;
      while (e+1 < items.length && items[e+1].top < items[e].top + items[e].h + NOTE_GAP) e++;
      let sum = 0, off = 0;
      for (let k=s; k<=e; k++){ sum += items[k].want - off; off += items[k].h + NOTE_GAP; }
      /* no floor clamp here — clamping mid-relaxation makes two clusters
         pile onto the floor and oscillate. The sweep below handles it. */
      let start = sum/(e-s+1);
      off = 0;
      for (let k=s; k<=e; k++){ items[k].top = start + off; off += items[k].h + NOTE_GAP; }
      changed = true;
      i = e;
    }
  }

  /* Relaxation gets each cluster centred on where its members want to be but
     isn't guaranteed to converge. One ordered sweep afterwards guarantees no
     overlaps, and because the clustering has already done the work, it pushes
     things only a little rather than cascading from the first note. */
  items.sort((a,b)=>a.top-b.top);
  let y = floor;
  for (const it of items){
    it.top = Math.max(it.top, y);
    y = it.top + it.h + NOTE_GAP;
  }

  let bottom = floor;
  for (const it of items){
    it.el.style.top = it.top + "px";
    /* honesty about displacement beats a note that quietly lies about
       what it points at */
    it.el.classList.toggle("drifted", Math.abs(it.top - it.want) > MAX_DRIFT);
    bottom = Math.max(bottom, it.top + it.h);
  }
  margin.style.height = (bottom + 24) + "px";
}

function checkWidth(){
  const stage = document.getElementById("stage");
  const narrow = window.innerWidth < 1180;
  stage.classList.toggle("narrow", narrow);
  if (!narrow) schedulePosition(); else {
    [...document.getElementById("margin").children].forEach(n=>n.style.top="");
    document.getElementById("margin").style.height="";
  }
}

/* ---------- the counts are the filter ---------- */
const SEV_LABEL = {error:"to correct", warn:"to look at", info:"noted", gap:"blank"};
let SEV_ON = {error:true, warn:true, info:true, gap:true};

function allFindings(){
  return [...document.querySelectorAll("#margin .finding, #margin .mnote.static")];
}

function renderChips(){
  const counts = {error:0,warn:0,info:0,gap:0};
  for (const f of allFindings()) counts[f.dataset.sev]++;
  const box = document.getElementById("chips");
  box.innerHTML = "";
  for (const sev of ["error","warn","info","gap"]){
    const b = document.createElement("button");
    b.className = "chip "+sev;
    b.setAttribute("aria-pressed", String(SEV_ON[sev]));
    b.disabled = !counts[sev];
    b.innerHTML = '<span class="dot"></span>'+counts[sev]+" "+SEV_LABEL[sev];
    b.onclick = ()=>{ SEV_ON[sev] = !SEV_ON[sev]; applyFilters(); renderChips(); };
    box.appendChild(b);
  }
  if (CENSUS.lines.length){
    const s = document.createElement("span");
    s.style.cssText = "color:var(--chrome-dim);font-size:12px";
    s.textContent = CENSUS.lines.join(" · ");
    box.appendChild(s);
  }
}

/* Filtering works on findings; a note disappears only when everything
   inside it has been filtered away. */
function applyFilters(){
  const aud = { author: document.getElementById("f-author").checked,
                reviewer: document.getElementById("f-reviewer").checked };
  const show = f => SEV_ON[f.dataset.sev] && (f.dataset.sev === "gap" || aud[f.dataset.aud] !== false);
  for (const f of allFindings()) f.hidden = !show(f);
  for (const n of document.querySelectorAll("#margin > .mnote")){
    const kids = [...n.querySelectorAll(".finding")];
    n.hidden = kids.length ? kids.every(k=>k.hidden) : n.hidden;
  }
  const gbox = document.getElementById("mglobal");
  if (gbox){
    const statics = [...gbox.querySelectorAll(".mnote.static")];
    const visible = statics.filter(s=>!s.hidden).length;
    const head = document.getElementById("mglobal-head");
    if (head){
      head.hidden = !visible;
      head.textContent = visible + " about the collection as a whole";
    }
  }
  schedulePosition();
}

/* =====================================================================
   4. WIRING
   ===================================================================== */

function load(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      MODEL = parseEAD(r.result);
      ISSUES = validate(MODEL);
      renderDocument();
      document.getElementById("fname").innerHTML =
        "<b>"+esc(file.name)+"</b> · "+MODEL.flat.length+" components";
      storeSet({lastFile:file.name, lastAt:Date.now()});
      armCloseWarning();
    } catch(err){
      const d = document.getElementById("drop");
      d.hidden = false;
      document.getElementById("stage").hidden = true;
      let h = "<h2>Couldn't read that file</h2><p>"+esc(err.message)+"</p>";
      if (err.line) h += "<p>Reported at line "+esc(err.line)+", column "+esc(err.column)+".</p>";
      if (err.advice) h += "<p>"+esc(err.advice)+"</p>";
      if (err.suspects && err.suspects.length) h += err.suspects.map(s=>"<pre>"+esc(s)+"</pre>").join("");
      h += '<button onclick="document.getElementById(\'file\').click()">Choose another file</button>';
      d.innerHTML = h;
    }
  };
  r.readAsText(file, "utf-8");
}

const fileInput = document.getElementById("file");
document.getElementById("pick").onclick = () => fileInput.click();
document.getElementById("pick2").onclick = () => fileInput.click();
fileInput.onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };

const drop = document.getElementById("drop");
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); if (ev==="drop"||e.target===drop) drop.classList.remove("over");
}));
document.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) load(f);
});

/* only arm once there's work to lose — a warning on every close teaches
   people to dismiss it */
let closeArmed = false;
function armCloseWarning(){
  if (closeArmed) return;
  closeArmed = true;
  window.addEventListener("beforeunload", e => { e.preventDefault(); e.returnValue = ""; });
}

document.getElementById("gear").onclick = function(){
  const s = document.getElementById("settings");
  const open = s.classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
};

for (const id of ["f-author","f-reviewer"])
  document.getElementById(id).addEventListener("change", ()=>{ applyFilters(); saveSettings(); });
for (const el of document.querySelectorAll('input[name=clmode], #showref, #uselinks'))
  el.addEventListener("change", () => { saveSettings(); if (MODEL) renderDocument(); });
document.getElementById("aspace").addEventListener("input", () => { saveSettings(); if (MODEL) renderDocument(); });
document.getElementById("reseturl").onclick = () => {
  document.getElementById("aspace").value = DEFAULT_ASPACE;
  saveSettings(); if (MODEL) renderDocument();
};
document.getElementById("forget").onclick = function(){
  storeClear();
  this.textContent = "Settings forgotten";
  setTimeout(()=>{ this.textContent = "Forget saved settings"; }, 2400);
};

window.addEventListener("resize", checkWidth);
/* anything that changes the document's height after placement — a late font,
   a wrapped line at a new width — invalidates every measurement */
if (window.ResizeObserver){
  const ro = new ResizeObserver(()=>schedulePosition());
  ro.observe(document.getElementById("doc"));
}

function saveSettings(){
  storeSet({
    aspace: document.getElementById("aspace").value,
    uselinks: document.getElementById("uselinks").checked,
    showref: document.getElementById("showref").checked,
    clmode: document.querySelector('input[name=clmode]:checked').value,
    fauthor: document.getElementById("f-author").checked,
    freviewer: document.getElementById("f-reviewer").checked
  });
}
function restoreSettings(){
  const s = storeGet();
  document.getElementById("aspace").value = s.aspace || DEFAULT_ASPACE;
  if (s.uselinks === false) document.getElementById("uselinks").checked = false;
  if (s.showref === true) document.getElementById("showref").checked = true;
  if (s.clmode){
    const r = document.querySelector('input[name=clmode][value="'+s.clmode+'"]');
    if (r) r.checked = true;
  }
  if (s.fauthor === false) document.getElementById("f-author").checked = false;
  if (s.freviewer === false) document.getElementById("f-reviewer").checked = false;
  if (s.lastFile){
    const mins = Math.round((Date.now() - (s.lastAt||Date.now()))/60000);
    const when = mins < 1 ? "just now" : mins < 60 ? mins+" minutes ago"
      : mins < 1440 ? Math.round(mins/60)+" hours ago" : Math.round(mins/1440)+" days ago";
    document.getElementById("lastfile").textContent = "Last opened " + s.lastFile + ", " + when + ".";
  }
}

document.getElementById("copy").onclick = function(){
  const doc = document.getElementById("doc");
  /* clear any hover highlight, or its tint travels into the paste */
  doc.querySelectorAll(".lit").forEach(el=>el.classList.remove("lit"));
  doc.classList.add("copying");
  const sel = window.getSelection(), range = document.createRange();
  range.selectNodeContents(doc);
  sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  sel.removeAllRanges();
  doc.classList.remove("copying");
  const orig = this.textContent;
  this.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(()=>{ this.textContent = orig; }, 2400);
};

restoreSettings();
checkWidth();
</script>
